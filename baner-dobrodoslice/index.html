<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bonus dobrodošlice</title>
  <link rel="stylesheet" href="banner.css" />
</head>
<body>
  <section class="banner" data-banner aria-label="Bonus dobrodošlice">
    <div class="layer bg" aria-hidden="true"></div>

    <div class="layer glow" aria-hidden="true">
      <img src="assets/glow.svg" alt="" />
    </div>

    <div class="casino" aria-hidden="true">
      <div class="layer rulet-wrap"><img class="rulet" src="assets/rulet.png" alt="" /></div>
      <img class="layer karte" src="assets/karte.svg" alt="" />
      <div class="layer kocke-wrap"><img class="kocke" src="assets/kocke.svg" alt="" /></div>
    </div>

    <div class="layer player-wrap" aria-hidden="true">
      <img class="player" src="assets/player.png" alt="" />
    </div>

    <div class="content">
      <p class="eyebrow">Bonus dobrodošlice</p>
      <h2 class="title">250.000 <span class="currency">RSD</span><br />250 Spinova</h2>
      <a class="cta" href="#">Registruj se</a>
    </div>
  </section>

  <script src="banner.js"></script>
</body>
</html>
